name: Zed registry

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update:
    name: Update the Zed extension registry
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - uses: huacnlee/zed-extension-action@82920ff0876879f65ffbcfa3403589114a8919c6 # v2
        with:
          extension-name: bats
          push-to: nertzy/extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
