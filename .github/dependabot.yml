version: 2
updates:
  - package-ecosystem: cargo
    directory: /test
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
    ignore:
      # extension.toml pins the grammar by commit; bump it with test/Cargo.toml's version by hand.
      - dependency-name: tree-sitter-bats

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
