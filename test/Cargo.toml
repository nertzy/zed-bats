[package]
name = "zed-bats-tests"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Query and task tests for the Bats Zed extension. Lives outside the extension root so Zed doesn't build it as a Rust extension."

[dev-dependencies]
insta = "1.49"
libc = "0.2"
serde_json = "1.0"
# Zed substitutes task variables with shellexpand; tests/tasks.rs does the same.
shellexpand = "3.1"
streaming-iterator = "0.1"
toml = "1.1"
tree-sitter = "0.27"
# Bump with [grammars.bats] rev in ../extension.toml: tests/manifest.rs checks that
# this release was published, clean, from that commit.
tree-sitter-bats = "=0.1.0"
