[package]
name = "zed-bats-tests"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Query and task tests for the Bats Zed extension. Lives outside the extension root so Zed doesn't build it as a Rust extension."

[dev-dependencies]
insta = "1.49"
serde_json = "1.0"
# Zed substitutes task variables with shellexpand; tests/tasks.rs does the same.
shellexpand = "3.1"
streaming-iterator = "0.1"
toml = "1.1"
tree-sitter = "0.27"
# Keep rev in sync with [grammars.bats] in ../extension.toml; tests/manifest.rs checks it.
tree-sitter-bats = { git = "https://github.com/nertzy/tree-sitter-bats", rev = "b0fb1f181073c3ef6a309cfa9c94f7d24600e12f" }
